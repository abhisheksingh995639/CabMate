<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ride - CabMate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-flex">
            <h1>CabMate</h1>
            <nav aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
            <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>
    <main>
        <section class="hero" style="margin-bottom: 24px; width:100%;">
            <h2>Create a New Ride</h2>
            <p>Fill in the details below to offer a new cab ride.</p>
        </section>
        <div class="dashboard-container">
            <section class="features" style="flex-direction:column;width:100%;">
                <div class="feature" style="width:100%;">
                    <form id="createRideForm" autocomplete="off">
                        <div class="form-group">
                            <label for="from">From</label>
                            <input type="text" id="from" name="from" required placeholder="Starting point">
                        </div>
                        <div class="form-group">
                            <label for="to">To</label>
                            <input type="text" id="to" name="to" required placeholder="Destination">
                        </div>
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" name="date" required>
                        </div>
                        <div class="form-group">
                            <label for="time">Time</label>
                            <input type="time" id="time" name="time" required>
                        </div>
                        <div class="form-group">
                            <label for="seats">Available Seats</label>
                            <input type="number" id="seats" name="seats" min="1" max="8" required placeholder="Number of seats">
                        </div>
                        <div class="form-group">
                            <label for="notes">Notes (optional)</label>
                            <input type="text" id="notes" name="notes" maxlength="100" placeholder="Any special info (e.g. luggage)">
                        </div>
                        <button type="submit" class="cta-btn animated-btn" style="margin-top:18px;">Create Ride</button>
                        <button type="button" onclick="location.href='dashboard.html';" class="cta-btn secondary animated-btn" style="margin-top:10px;">Cancel</button>
                    </form>
                </div>
            </section>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 CabMate. All rights reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
    <script>
    document.getElementById('createRideForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const user = JSON.parse(localStorage.getItem('cabshareUser'));
        // CHANGE THIS LINE: Use user.regno for the owner
        const ownerIdentifier = user ? user.regno : 'Guest'; 

        if (!ownerIdentifier || ownerIdentifier === 'Guest') {
            alert('Please log in to create a ride.');
            return;
        }

        const from = document.getElementById('from').value;
        const to = document.getElementById('to').value;
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;
        const seats = parseInt(document.getElementById('seats').value, 10);
        const notes = document.getElementById('notes').value;

        const newRide = {
            from,
            to,
            date,
            time,
            seats,
            notes,
            owner: ownerIdentifier, // NOW this will save the regno
            joined: []
        };

        try {
            const response = await fetch('https://cabmate-backend.onrender.com/api/rides', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(newRide)
            });

            if (response.ok) {
                const ride = await response.json();
                alert('Ride created successfully!');
                location.href = 'dashboard.html'; // Redirect to dashboard or available rides
            } else {
                alert('Failed to create ride. Please try again.');
                console.error('Server response:', await response.text());
            }
        } catch (error) {
            console.error('Error creating ride:', error);
            alert('An error occurred while creating the ride.');
        }
    });
</script>
</body>
</html>
