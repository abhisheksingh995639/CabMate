<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login - CabMate</title>
</head>
<body>
    <header>
        <div class="container header-flex">
            <h1>CabMate</h1>
            <nav aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="login.html" aria-current="page">Login</a></li>
                </ul>
            </nav>
            <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>
    <main>
        <div class="login-container">
            <h2>Login to CabMate</h2>
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">Registration Number</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit">Login</button>
            </form>
            <!-- <div style="margin-top:18px; text-align:center;">
                <a href="#" style="color:var(--accent-dark);font-size:0.98rem;text-decoration:underline;">Forgot password?</a>
            </div> -->
            <div style="margin-top:10px; text-align:center;">
                <span style="color:var(--text-light);font-size:0.97rem;">New to CabMate?</span>
                <a href="signup.html" style="color:var(--accent);font-size:1rem;font-weight:600;text-decoration:underline; margin-left:4px;">Sign up</a>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 CabMate. All rights reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
